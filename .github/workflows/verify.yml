name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -B verify
      - run: ./scripts/run-local.sh --skip-build
      - run: python3 scripts/smoke-test.py
      - if: always()
        run: ./scripts/stop-local.sh
