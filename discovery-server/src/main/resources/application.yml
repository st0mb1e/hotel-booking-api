server:
  port: ${PORT:8761}
spring:
  application:
    name: discovery-server
eureka:
  server:
    response-cache-update-interval-ms: 1000
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: logstash
